<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="config.js"></script>
    <title>GeoWeb</title>
    <script>
        document.write('<script src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=' + VWORLD_API_KEY + '">') 
            </script>;
    </script>
    <style>
    .search-box {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 100; 
        background: rgba(255, 255, 255, 0.693);
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    input { padding: 8px; border: 1px solid #ccc; width: 200px; }
    button { padding: 8px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
</style>
</head>
<body>

<div class="search-box">
    <input type="text" id="searchKeyword" placeholder="읍면동 검색">
    <button onclick="searchAddress()">검색</button>
</div>

<div id="vmap" style="position:relative;width:100%;height:90vh;left:0px;top:0px"></div>
 <script>
    let mapController;
    let currentMapMode=0;
    let map2d;
 
        vw.MapControllerOption = {
                container : "vmap",
                mapMode : "2d-map",
                basemapType : vw.ol3.BasemapType.GRP_LGT,
                poiType:vw.ol3.BasemapType.VT_NONE,
                roadType:vw.ol3.BasemapType.VT_NONE,
                controlDensity : vw.ol3.DensityType.EMPTY,
                interactionDensity : vw.ol3.DensityType.BASIC,
                controlsAutoArrange : true,
                homePosition : vw.ol3.CameraPosition,
                initPosition : vw.ol3.CameraPosition,
            };
        mapController = new vw.MapController(vw.MapControllerOption);      
        map2d = mapController.Map2D;
    

 </script>
</body>
