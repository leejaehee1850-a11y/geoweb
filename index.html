<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <!-- 리플렛 관련 CSS 불러오기 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { margin: 0; }
        #map { height: 100vh; } /* 지도 보여주기*/

        /* 검색창 구현 시작 */
        /* 검색창 컨테이너 스타일 */
        .search-container {
            position: absolute; /* 검색창을 지도 위로 배치 !평면 상(x,y축) 배치*/ 
            top: 12px;          /* 위에서 12px 띄움 */
            left: 50px;         /* 왼쪽에서 50px 띄움 (줌 버튼 피하기 위해) */
            z-index: 1000;      /* 지도보다 위에 보이게 설정 !겹침의 순서(z축) 배치 */
            display: flex;      /* 입력창과 버튼을 가로로 나란히 배치 */
            background: white; /* 내부여백 */
            padding: 5px;       
            border-radius: 4px; /* 테두리 곡률 */
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); /* 박스의그림자 가로 세로 번짐 색상 */
        }

        /* 검색창 스타일 */
        .search-text {
            width: 250px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            outline: none; /* 검색창 클릭 시 검은 테두리 없앰 */
        }

        /* 검색 버튼 스타일 */
        .search-button {
            padding: 8px 15px; /* 검색 버튼 사이의 pdding */
            background-color: #a7a164;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-weight: bold;
        }

        .search-button:hover {
            background-color: #608d67;
        }
        /* 검색창 구현 끝 */
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" id="text" class="search-text" placeholder="읍면동을 입력하세요 (예: 영등포구)">
        <button id="search" class="search-button">검색</button>
    </div>

    <div id="map"></div>
    <!-- 리플렛 관련 Js 함수 -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // L : leaflet, setView[위도, 경도, 줌]
        // var map = L.map('map').setView([36.5, 127.8], 8);
        var map = L.map('map').setView([48.9, 139.1], 7);

        // 해당 관련하여 위,경도 및 줌 알아오기
        map.on('moveend', function() {
            console.log("hyun20ee===중심좌표:", map.getCenter());
            console.log("hyun20ee===줌:", map.getZoom());
        });

        // 지오서버 내 띄운 지도 깔기
        // 1. wms 방식으로 지도 가져오겠다
        // 2. GeoServer 안에 geoProject라는 작업공간 안에 emd 레이어
        // 3. 지도를 그림파일로
        // 4. 데이터가 없는 부분은 투명하게 처리하겠다
        // 지오서버로 바로 요청 때리 지도도 img로 가져와서 cors 오류 xx //
        // but fetch로 api떄리는 순간 cors 걸림 //
        L.tileLayer.wms("http://localhost:8081/geoserver/geoProject/wms", {
            layers: "geoProject:emd",
            format: "image/png",
            transparent: true,
            // 좌표 맞추기 기본 Leafle 기본 지도 좌표계는 EPSG:3857 밑 코드가 웹에서 깨져서 지오서버 내 3857로 변경 --> 수정 걍 추가 안해야지 맞았던 것임
            // srs: 'EPSG:5181'
        }).addTo(map);

        // 검색 버튼 UI만
        document.getElementById('search').addEventListener('click', function() {
            var val = document.getElementById('text').value;
            if(val) {
                alert(val + " 검색 기능을 구현할 차례입니다!");
            } else {
                alert("검색어를 입력해주세요.");
            }
        });
    </script>
</body>
</html>
